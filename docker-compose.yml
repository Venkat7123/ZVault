# Bots Bank gateway on IBM LinuxONE.
#
# network_mode: host is deliberate. Db2's trusted context only lets AIGW switch users when the
# connection comes from 172.17.0.1 (the Docker host address). A bridge-network container would
# arrive from another address and Db2 would refuse the switch. With host networking the gateway
# reaches Db2 (127.0.0.1:50000) and Granite (127.0.0.1:8080) exactly like the systemd version,
# which is also why Db2 and Granite stay private: only the gateway port is published.
#
# Secrets come from ~/.botsbank_env (never in the image, never in Git).
services:
  gateway:
    build: .
    image: botsbank-gateway:latest
    container_name: botsbank-gateway
    network_mode: host
    env_file:
      - ${BOTSBANK_ENV_FILE:-/home/linux1/.botsbank_env}
    environment:
      PORT: ${PUBLIC_PORT:-8000}      # the ONE public port (0.0.0.0:PORT)
      PUBLIC_MODE: "1"                # hides /docs and /openapi.json
      DB_HOST: 127.0.0.1
      LLM_URL: http://127.0.0.1:8080/v1/chat/completions
    restart: unless-stopped           # comes back after a crash or a Docker restart
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ZVault quantum-safe vault (Phase C). Debian 13 image = OpenSSL 3.5 (ML-KEM, ML-DSA) on s390x.
  # Listens on 127.0.0.1:8090 only (host network, like the gateway, but NOT published): only the
  # gateway on this machine can reach it. Code is mounted read-only; keys and encrypted copies live
  # in ~/zvault_data (chmod 700). Tokens come from ~/.zvault_env (never in the image or in Git).
  vault:
    build: ./vault
    image: zvault-vault:latest
    container_name: zvault-vault
    network_mode: host
    user: "${VAULT_UID:-1000}:${VAULT_GID:-1000}"
    working_dir: /vault
    command: ["python3", "service.py"]
    env_file:
      - ${ZVAULT_ENV_FILE:-/home/linux1/.zvault_env}
    environment:
      VAULT_BIND: 127.0.0.1
      VAULT_PORT: "8090"
      VAULT_DATA: /data
      VAULT_MODELS: /vault/models
    volumes:
      - ./vault:/vault:ro
      - ${ZVAULT_DATA_DIR:-/home/linux1/zvault_data}:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
